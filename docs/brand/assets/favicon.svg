<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 86">
  <!-- Spotva icon mark — "S + Spot/Access Point" (approved, supersedes Concept A). Two semicircular bowls (radius R) sharing a vertical spine, stroke width = 4/3 * R, round caps. Top bowl bulges left, bottom bowl bulges right (SVG arc sweep-flags 0 then 1) — the standard construction for a geometric "S." The top terminus is covered by a solid dot (radius = 0.55 * stroke width) instead of its round cap, read as the path arriving at a spot/access point. R=15, stroke=20 at this file's scale. See docs/SPOTVA_BRAND_IDENTITY_GUIDELINES_V1.md §12. Variant: favicon-specific cut (tighter padding than icon-mark.svg) — verified legible at true 16x16 and 32x32px. -->
  <path d="M 28 13 A 15 15 0 0 0 28 43 A 15 15 0 0 1 28 73" fill="none" stroke="#26453A" stroke-width="20" stroke-linecap="round"/><circle cx="28" cy="13" r="11" fill="#DB8A2E"/>
</svg>