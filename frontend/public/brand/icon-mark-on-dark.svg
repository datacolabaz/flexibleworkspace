<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 62 92">
  <!-- Spotva icon mark — "S + Spot/Access Point" (approved, supersedes Concept A). Two semicircular bowls (radius R) sharing a vertical spine, stroke width = 4/3 * R, round caps. Top bowl bulges left, bottom bowl bulges right (SVG arc sweep-flags 0 then 1) — the standard construction for a geometric "S." The top terminus is covered by a solid dot (radius = 0.55 * stroke width) instead of its round cap, read as the path arriving at a spot/access point. R=15, stroke=20 at this file's scale. See docs/SPOTVA_BRAND_IDENTITY_GUIDELINES_V1.md §12. Variant: dark backgrounds — S in cream (oil-green would fail contrast on oil-900), dot stays amber. -->
  <path d="M 31 16 A 15 15 0 0 0 31 46 A 15 15 0 0 1 31 76" fill="none" stroke="#FBFAF6" stroke-width="20" stroke-linecap="round"/><circle cx="31" cy="16" r="11" fill="#DB8A2E"/>
</svg>